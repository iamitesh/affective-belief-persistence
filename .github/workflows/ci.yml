name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked project
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Verify generated schemas
        run: uv run python scripts/generate_schemas.py --check

      - name: Test
        run: uv run pytest --cov=affective_belief_persistence --cov-report=term-missing --cov-report=xml

      - name: Validate smoke configuration
        run: uv run abp validate-config --config configs/experiments/smoke.yaml

      - name: Run deterministic offline experiment
        run: uv run abp dry-run --config configs/experiments/smoke.yaml --output "${{ runner.temp }}/abp-smoke"
